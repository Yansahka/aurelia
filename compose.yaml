services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aurelia
      POSTGRES_USER: aurelia_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aurelia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia_owner -d aurelia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aurelia_postgres:

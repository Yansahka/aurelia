<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurelia — Parfumerie botanique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e7;--ink:#2a1520;--plum:#2b1620;--mut:#7c6a69;--acc:#b4472b;--sand:#ebe2d4;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font:15px/1.5 var(--sans);background:var(--bg);color:var(--ink);overflow-x:hidden}
em{font-family:var(--serif);font-style:italic;font-weight:400}
button,input{font:inherit;color:inherit;border:0;background:none}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;background:var(--bg);color:var(--ink);font-size:13px;font-weight:500;transition:transform .3s var(--ease)}
.btn:hover{transform:translateY(-2px)}.btn.dk{background:var(--plum);color:#fff}
/* nav */
.nav{position:fixed;top:14px;left:0;right:0;margin:0 auto;width:min(1100px,calc(100% - 28px));z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:9px 16px;border-radius:16px;color:#fff;background:rgba(40,20,28,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .4s,color .4s,box-shadow .4s;animation:fade 1s .3s both}
.nav.solid{background:rgba(250,246,239,.92);color:var(--ink);box-shadow:0 8px 30px rgba(43,22,32,.1)}
.nav ul{display:flex;gap:20px;list-style:none;font-size:13px}.nav ul a{opacity:.85}.nav ul a:hover{opacity:1}
.logo{font:italic 26px var(--serif)}.nav .r{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.srch{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12px;width:170px}
.nav.solid .srch{background:rgba(43,22,32,.07)}.srch input{width:100%;outline:0}.srch input::placeholder{color:inherit;opacity:.6}
.ib{position:relative;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}.ib:hover{background:rgba(128,128,128,.15)}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cnt{position:absolute;top:0;right:0;min-width:15px;height:15px;border-radius:9px;background:var(--acc);color:#fff;font-size:9px;display:none;place-items:center;padding:0 3px}.cnt.on{display:grid}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;padding:0 clamp(20px,5vw,64px) 9vh;color:#fff;overflow:hidden;background:radial-gradient(120% 90% at 72% 30%,#7b6a5d 0,#3c2b2d 48%,#1d0f15 100%)}
.hero .art{position:absolute;right:0;top:0;width:62%;height:100%}.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(29,15,21,.85) 0,transparent 60%)}
.hero .tx{position:relative;max-width:760px}
.hero h1{font:500 clamp(38px,6vw,76px)/1.02 var(--sans);letter-spacing:-.035em}
.hero h1 span{display:block;overflow:hidden;padding-bottom:.06em}.hero h1 i{display:block;font-style:normal;transform:translateY(110%);animation:up 1.1s var(--ease) forwards}
.hero h1 em{font-size:1.04em;letter-spacing:-.02em}
.hero p{margin:18px 0 22px;font-size:13px;max-width:360px;opacity:0;animation:fade 1s 1s forwards;color:#e8dcd2}.hero .btn{opacity:0;animation:fade 1s 1.2s forwards}
.glass{position:absolute;right:clamp(16px,5vw,64px);bottom:9vh;width:150px;padding:14px;border-radius:14px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11px;animation:fade 1s 1.4s both}
.glass b{display:block;font:italic 40px/1.1 var(--serif);font-weight:400}
@keyframes up{to{transform:none}}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* sections */
.sec{max-width:1280px;margin:0 auto;padding:110px clamp(20px,5vw,64px) 0;position:relative}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;gap:16px}
h2{font:400 clamp(26px,3.4vw,40px)/1.1 var(--sans);letter-spacing:-.03em;color:#4a3a3d}h2 em{color:var(--ink);font-size:1.08em}
.more{font-size:12px;border-bottom:1px solid currentColor;white-space:nowrap}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease)}.rv.in{opacity:1;transform:none}
/* carousel */
.cw{position:relative}.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}.track::-webkit-scrollbar{display:none}
.pc{flex:0 0 clamp(230px,23.4%,300px);scroll-snap-align:start;background:#fbf8f2;border-radius:18px;padding:6px 6px 14px;transition:transform .5s var(--ease)}.pc:hover{transform:translateY(-4px)}
.pi{position:relative;aspect-ratio:4/4.6;border-radius:14px;overflow:hidden}.pi img{transition:transform .8s var(--ease)}.pc:hover .pi img{transform:scale(1.05)}
.bdg{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:7px;font-size:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
.pm{display:flex;align-items:center;gap:6px;margin:12px 8px 6px;font-size:11px;color:var(--mut)}.sw{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.pn{margin:0 8px;font-size:13px;font-weight:600}.pt{margin:2px 8px 0;font-size:12px;color:var(--mut);min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pf{display:flex;justify-content:space-between;align-items:center;margin:12px 8px 0}.pr{font-weight:600;font-size:14px}.pr s{font-weight:400;font-size:11px;color:var(--mut);margin-left:6px}
.add{padding:7px 13px;border-radius:99px;background:var(--plum);color:#fff;font-size:12px;transition:background .3s}.add:hover{background:var(--acc)}
.arr{position:absolute;top:38%;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15);display:grid;place-items:center;z-index:2}.arr.l{left:-12px}.arr.r{right:-12px}
.empty{padding:40px;color:var(--mut)}
/* story */
.story{margin:110px clamp(12px,3vw,40px) 0;border-radius:26px;min-height:92vh;display:flex;align-items:flex-end;padding:clamp(24px,5vw,64px);color:#fff;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(30,16,20,.1),rgba(30,16,20,.8)),repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.08) 118px 124px),repeating-linear-gradient(0deg,#6f5a4f 0 74px,#3b2a28 74px 80px)}
.story p{position:relative;max-width:640px;font:500 clamp(20px,2.6vw,30px)/1.25 var(--sans);letter-spacing:-.02em}.story .w{opacity:.25;transition:opacity .4s}.story em{color:#e7c9a0}
/* rituals */
.rt{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.rc{position:relative;aspect-ratio:3/4.3;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:22px 10px;color:#fff;text-align:center;font-size:13px}
.rc::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(20,8,12,.55))}.rc>*{position:relative;z-index:1}.rc .bg{position:absolute;inset:0;z-index:0;transition:transform .9s var(--ease)}.rc:hover .bg{transform:scale(1.08)}
.rc em{font-size:24px;display:block}.rc .btn{margin-top:10px;padding:6px 14px;font-size:11px}
/* best sellers */
.bs{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:start}.bs .l{position:sticky;top:130px}.bs .l p{margin:14px 0 20px;max-width:300px;font-size:13px;color:var(--mut)}
.bc{position:sticky;top:110px;height:min(440px,62vh);border-radius:22px;margin-bottom:26px;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:20px;justify-content:space-between}
.bc img{position:absolute;inset:0}.bc div{position:relative;z-index:1}.bc::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(20,8,12,.6))}.bc b{font-size:17px}.bc small{display:block;opacity:.85}
.na{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,80px);align-items:center}.na .im{aspect-ratio:1;border-radius:22px;overflow:hidden}.na p{margin:12px 0 20px;max-width:340px;font-size:13px;color:var(--mut)}
/* gallery + reviews */
.mqw{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq{display:flex;gap:12px;width:max-content;animation:mq 50s linear infinite}.mqw:hover .mq{animation-play-state:paused}@keyframes mq{to{transform:translateX(-50%)}}
.gt{position:relative;width:150px;height:190px;border-radius:12px;overflow:hidden;color:#fff;font-size:10px}.gt span{position:absolute;left:8px;bottom:7px}.gt::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.5))}.gt span{z-index:1}
.rb{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:10px;background:var(--sand);border-radius:22px;padding:22px 0 22px 26px;overflow:hidden;margin-top:34px}
.rb .big{font:italic 54px/1 var(--serif)}.rb .big small{font:12px var(--sans);color:var(--mut)}.rb p{font-size:11px;color:var(--mut);margin-top:6px}
.rv-c{width:250px;flex:none;background:#f9f5ee;border-radius:14px;padding:16px;font-size:13px}.rv-c i{font:italic 30px/.6 var(--serif);color:var(--acc)}.rv-c p{margin:8px 0 14px;font-size:13px;color:var(--ink)}.rv-c hr{border:0;border-top:1px solid rgba(0,0,0,.08);margin-bottom:10px}.rv-c b{font:italic 400 17px var(--serif)}.rv-c small{display:block;color:var(--mut)}
.cm{text-align:center;max-width:640px;margin:0 auto;font:500 clamp(18px,2.2vw,24px)/1.6 var(--sans);letter-spacing:-.02em}.cm .pl{display:inline-block;width:46px;height:28px;border-radius:8px;vertical-align:middle;margin:0 3px}.cm em{color:var(--acc)}
/* footer */
.ft{margin-top:110px;background:var(--plum);color:#f6efe5;border-radius:26px 26px 0 0;padding:clamp(24px,4vw,56px) clamp(20px,5vw,64px) 24px;overflow:hidden}
.fg{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}.ft h3{font:400 clamp(22px,2.6vw,32px) var(--sans);letter-spacing:-.02em}
.nl{display:flex;gap:8px;margin-top:16px}.nl input{padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12px;width:210px;outline:0}
.cols{display:flex;gap:44px;font-size:12px}.cols h4{font:italic 400 17px var(--serif);color:#d9b99c;margin-bottom:10px}.cols a{display:block;opacity:.8;margin-bottom:6px}.cols a:hover{opacity:1}
.wm{font:italic clamp(90px,24vw,320px)/.95 var(--serif);text-align:center;margin-top:30px;letter-spacing:-.02em}
.fb{display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:10px}
/* drawer, toast, wa */
.ov{position:fixed;inset:0;background:rgba(43,22,32,.45);opacity:0;pointer-events:none;transition:opacity .4s;z-index:90}.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:10px;right:10px;bottom:10px;width:min(380px,calc(100% - 20px));background:var(--bg);border-radius:20px;z-index:100;transform:translateX(115%);transition:transform .6s var(--ease);display:flex;flex-direction:column;padding:18px}.dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;font:italic 24px var(--serif)}.di{flex:1;overflow:auto;margin:14px 0}.di>p{color:var(--mut);font-size:13px}
.ci{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:13px}.ci .t{width:52px;height:60px;border-radius:9px;overflow:hidden}.ci small{color:var(--mut);display:block}
.qty{display:flex;align-items:center;gap:8px;font-size:13px}.qty button{width:22px;height:22px;border-radius:50%;background:var(--sand)}
.sub{display:flex;justify-content:space-between;font-weight:600;margin-bottom:12px}.go{width:100%;justify-content:center;padding:13px;font-size:14px;background:#1f9d55;color:#fff}.hint{font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--plum);color:#fff;padding:9px 18px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.5s var(--ease);z-index:120}.toast.on{opacity:1;transform:translate(-50%,0)}
.wa{position:fixed;right:18px;bottom:20px;z-index:60;width:52px;height:52px;border-radius:50%;background:#1f9d55;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(31,157,85,.4);transition:transform .3s var(--ease)}.wa:hover{transform:scale(1.08)}.wa svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:820px){.nav ul,.srch{display:none}.nav{grid-template-columns:1fr auto}.nav .logo{order:-1}.rt{grid-template-columns:repeat(2,1fr)}.bs,.na{grid-template-columns:1fr}.bs .l{position:static}.rb{grid-template-columns:1fr;padding-left:0}.rb>div:first-child{padding:0 22px}.hero .art{width:100%;opacity:.6}.glass{display:none}.cols{gap:26px}.arr{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}.mq{animation:none}}
</style>
</head>
<body>

<header class="nav" id="nav">
  <ul><li><a href="#shop">Boutique</a></li><li><a href="#best">Best-sellers</a></li><li><a href="#gallery">Galerie</a></li><li><a href="#about">À propos</a></li></ul>
  <a class="logo" href="#" id="logo">Aurelia</a>
  <div class="r">
    <label class="srch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Rechercher un parfum" aria-label="Rechercher"></label>
    <button class="ib" id="bagBtn" aria-label="Panier"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="cnt" id="cnt">0</span></button>
    <a class="ib" href="#" aria-label="Compte"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></a>
  </div>
</header>

<main id="app"></main>

<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-label="Panier">
  <div class="dh"><span>Votre <em>panier</em></span><button class="ib" id="closeBag" aria-label="Fermer"><svg viewBox="0 0 24 24" width="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="di" id="items"></div>
  <div><div class="sub"><span>Sous-total</span><span id="sub">0</span></div>

<script>
/* ============================================================
   CONFIG — passer MOCK à false pour brancher le backend
   ============================================================ */
const CONFIG = { MOCK: true, API_BASE: 'https://api.example.com/v1', STORE_SLUG: 'aurelia' };

/* ---------- Illustrations de flacons (remplacées par product.image quand il existe) ---------- */
const bottle = (a, b, shape = 0, bg = '#efe3c9') => {
  const g = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`;
  const body = shape === 1 ? '<circle cx="100" cy="158" r="56" fill="url(#g)"/><rect x="90" y="88" width="20" height="16" fill="#2a1a14"/><rect x="82" y="58" width="36" height="32" rx="16" fill="#2a1a14"/><rect x="74" y="150" width="52" height="30" rx="4" fill="rgba(255,255,255,.7)"/>'
    : shape === 2 ? '<rect x="76" y="86" width="48" height="136" rx="8" fill="url(#g)"/><rect x="86" y="46" width="28" height="42" rx="4" fill="#2a1a14"/><rect x="82" y="150" width="36" height="40" rx="3" fill="rgba(255,255,255,.7)"/>'
    : '<rect x="52" y="100" width="96" height="118" rx="12" fill="url(#g)"/><rect x="92" y="90" width="16" height="12" fill="#2a1a14"/><rect x="82" y="58" width="36" height="34" rx="5" fill="#2a1a14"/><rect x="70" y="146" width="60" height="42" rx="3" fill="rgba(255,255,255,.7)"/>';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">${g}<rect width="200" height="250" fill="${bg}"/><ellipse cx="100" cy="226" rx="52" ry="7" fill="rgba(0,0,0,.14)"/>${body}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
};
const tile = (c) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" preserveAspectRatio="none"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="100" height="130" fill="url(#t)"/></svg>`);

/* ---------- Données fictives (même forme que GET /public/stores/:slug/home) ---------- */
const MOCK = { home: {
  store: {
    slug: 'aurelia', name: 'Aurelia', currency: 'FCFA', locale: 'fr-FR', whatsapp: '237690000000',
    whatsappMessage: 'Bonjour Aurelia, je souhaite commander :',
    hero: { title: 'Parfums|*botaniques* pour|des rituels plus lents', subtitle: 'Des fragrances composées à la main, à partir de matières végétales sélectionnées avec soin, pour accompagner vos matins pressés comme vos soirées calmes.', cta: 'Découvrir', statValue: '98%', statLabel: 'de clients conquis, avis vérifiés' },
    story: 'Nous composons des *parfums* que vous porterez longtemps, des matins pressés aux *soirées lentes*. Chaque flacon est préparé à la main dans notre atelier, à partir de *matières botaniques* et de rien d’imprononçable.',
    commitment: 'Découvrez notre engagement pour des {0} *ingrédients d’origine végétale*, des recharges à faible déchet et un *sourcing équitable*, pour un sillage plus doux et une {1} *planète plus douce*.',
    footer: { tagline: 'Notes lentes, *une fois par mois*', columns: [
      { title: 'Boutique', links: [{ label: 'Fleurs', href: '#shop' }, { label: 'Bois', href: '#shop' }, { label: 'Ambres', href: '#shop' }, { label: 'Recharges', href: '#shop' }] },
      { title: 'À propos', links: [{ label: 'Notre atelier', href: '#about' }, { label: 'Ingrédients', href: '#about' }, { label: 'Journal', href: '#about' }] },
      { title: 'Aide', links: [{ label: 'Livraison', href: '#' }, { label: 'Retours', href: '#' }, { label: 'Contact WhatsApp', href: '#wa' }] } ] }
  },
  products: [
    { id: 'p1', name: 'Oud Nocturne', tagline: 'Eau de parfum boisée, safran et ambre noir pour les soirées longues.', price: 42000, oldPrice: 48000, size: '50 ml', note: 'Oud', badge: 'Promotion', family: 'bois', swatches: ['#b9792a', '#5b3a1e', '#8e8a7a'], shape: 0, palette: ['#d9922b', '#7a4a12'], bg: '#efdba8' },
    { id: 'p2', name: 'Rose de Mai', tagline: 'Rose fraîche, pivoine et musc blanc, un bouquet léger au lever du jour.', price: 38500, size: '50 ml', note: 'Rose', badge: 'Nouveau', family: 'fleurs', swatches: ['#d98a98', '#7a3d4e'], shape: 1, palette: ['#e8a5b0', '#9b3d55'], bg: '#d9d0cf' },

    { id: 'p4', name: 'Ambre Solaire', tagline: 'Ambre chaud, vanille et fleur d’oranger, doux comme une peau au soleil.', price: 24000, size: '30 ml', note: 'Ambre', badge: 'Nouveau', family: 'ambre', swatches: ['#e8d36a', '#c98a2b'], shape: 0, palette: ['#f1c04a', '#b36a14'], bg: '#dfe4e6' },

/* ---------- Couche API : seul endroit à modifier pour brancher le backend ---------- */
const API = {
  async _req(path, opts) {
    const r = await fetch(`${CONFIG.API_BASE}/public/stores/${CONFIG.STORE_SLUG}${path}`, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (!r.ok) throw new Error('API ' + r.status);
    return r.status === 204 ? null : r.json();
  },
  home: () => CONFIG.MOCK ? Promise.resolve(MOCK.home) : API._req('/home'),
  createOrder: (payload) => CONFIG.MOCK ? (console.info('[mock] POST /orders', payload), Promise.resolve({ code: 'MOCK' })) : API._req('/orders', { method: 'POST', body: JSON.stringify(payload), keepalive: true }),
  subscribe: (email) => CONFIG.MOCK ? (console.info('[mock] POST /newsletter', email), Promise.resolve()) : API._req('/newsletter', { method: 'POST', body: JSON.stringify({ email }) }),
  track: (type, productId) => CONFIG.MOCK ? undefined : API._req('/events', { method: 'POST', body: JSON.stringify({ events: [{ type, productId }] }), keepalive: true }).catch(() => {})
};

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hl = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
let S, cart = [];
const money = (n) => new Intl.NumberFormat(S.store.locale).format(n).replace(/\u202f|\u00a0/g, ' ') + ' ' + S.store.currency;
const img = (p, bg) => p.image || bottle(p.palette, p.palette[1], p.shape, p.bg);
const byId = (id) => S.products.find((p) => p.id === id);
const load = () => { try { cart = JSON.parse(localStorage.getItem('cart:' + CONFIG.STORE_SLUG) || '[]'); } catch (e) { cart = []; } };
const save = () => { try { localStorage.setItem('cart:' + CONFIG.STORE_SLUG, JSON.stringify(cart)); } catch (e) {} };
let tt; const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); };

/* ---------- Rendu ---------- */
const card = (p) => `<article class="pc"><div class="pi"><img src="${esc(img(p))}" alt="${esc(p.name)}" loading="lazy">${p.badge ? `<span class="bdg">${esc(p.badge)}</span>` : ''}</div>
  <div class="pm">${(p.swatches || []).map((c) => `<i class="sw" style="background:${esc(c)}"></i>`).join('')}<span>${esc(p.size)} · ${esc(p.note)}</span></div>
  <div class="pn">${esc(p.name)}</div><div class="pt">${esc(p.tagline)}</div>
  <div class="pf"><span class="pr">${money(p.price)}${p.oldPrice ? `<s>${money(p.oldPrice)}</s>` : ''}</span><button class="add" data-add="${esc(p.id)}">+ Panier</button></div></article>`;

function renderTrack(list) { $('#track').innerHTML = list.length ? list.map(card).join('') : '<p class="empty">Aucun parfum ne correspond à votre recherche.</p>'; }

function render() {
  const { store: st, collections, featured, newArrival, gallery, reviews } = S;
  const lines = st.hero.title.split('|').map((l) => `<span><i>${hl(l)}</i></span>`).join('');
  const wr = (t, tag) => t.split(/(\s+)/).map((w) => /^\s*$/.test(w) ? w : `<${tag} class="w">${esc(w)}</${tag}>`).join('');
  const tr = st.story.split(/(\*[^*]+\*)/).filter(Boolean).map((t) => t.startsWith('*') ? wr(t.slice(1, -1), 'em') : wr(t, 'span')).join('');
  const pills = [['#c9a27a', '#5a7a4a'], ['#d98a98', '#8a4a16']];
  const cm = hl(st.commitment).replace(/\{(\d)\}/g, (_, i) => `<i class="pl" style="background:linear-gradient(135deg,${pills[i][0]},${pills[i][1]})"></i>`);
  const na = byId(newArrival.productId), bs = featured.productIds.map(byId).filter(Boolean);
  const mq = (arr) => arr.concat(arr).join('');
  $('#logo').textContent = st.name; document.title = st.name + ' — Parfumerie botanique';
  $('#wa').href = `https://wa.me/${st.whatsapp}?text=${encodeURIComponent('Bonjour ' + st.name + ', j’ai une question.')}`;

  $('#app').innerHTML = `
  <section class="hero"><svg class="art" id="art" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice"></svg><div class="shade"></div>
    <div class="tx"><h1>${lines}</h1><p>${esc(st.hero.subtitle)}</p><a class="btn" href="#shop">${esc(st.hero.cta)} →</a></div>
    <div class="glass">${esc(st.hero.statLabel)}<b>${esc(st.hero.statValue)}</b></div></section>

  <section class="sec" id="shop"><div class="sh rv"><h2>Essentiels végétaux,<br>les plus aimés <em>Parfums</em></h2><a class="more" href="#shop">Tous les parfums ↗</a></div>
    <div class="cw rv"><button class="arr l" data-sc="-1" aria-label="Précédent">←</button><div class="track" id="track"></div><button class="arr r" data-sc="1" aria-label="Suivant">→</button></div></section>

  <section class="story rv" id="story"><p>${tr}</p></section>

  <section class="sec" id="rituals"><div class="sh rv"><h2>Explorez nos familles <em>olfactives</em><br>douces et végétales</h2></div>
    <div class="rt">${collections.map((c, i) => `<a class="rc rv" style="transition-delay:${i * 90}ms" href="#shop" data-fam="${esc(c.slug)}"><div class="bg" style="background:url('${tile(c.gradient)}') center/cover"></div><span>Explorer</span><em>${esc(c.name)}</em><span class="btn">Voir →</span></a>`).join('')}</div></section>

  <section class="sec" id="best"><div class="bs"><div class="l rv"><h2>${hl(featured.title)}</h2><p>${esc(featured.text)}</p><a class="btn dk" href="#shop">Tout voir →</a></div>
    <div>${bs.map((p) => `<div class="bc"><img src="${esc(img(p))}" alt="${esc(p.name)}" loading="lazy"><div><b>${esc(p.name)}</b><small>${esc(p.size)} · ${esc(p.note)}</small></div><div><b>${money(p.price)}</b></div></div>`).join('')}</div></div></section>

  ${na ? `<section class="sec"><div class="na"><div class="im rv"><img src="${esc(img(na))}" alt="${esc(na.name)}" loading="lazy"></div><div class="rv"><h2>${hl(newArrival.title)}</h2><p>${esc(newArrival.text)}</p><button class="btn dk" data-add="${esc(na.id)}">Ajouter · ${money(na.price)}</button></div></div></section>` : ''}

  <section class="sec" id="gallery"><div class="mqw rv"><div class="mq">${mq(gallery.map((g) => `<div class="gt" style="background:url('${tile(g.colors)}') center/cover"><span>${esc(g.label)}</span></div>`))}</div></div>
    <div class="rb rv"><div><div class="big">${reviews.rating.toFixed(1)}<small> /5</small></div><p>Basé sur ${new Intl.NumberFormat(st.locale).format(reviews.count)} avis clients</p></div>
    <div class="mqw"><div class="mq" style="animation-duration:60s">${mq(reviews.items.map((r) => `<div class="rv-c"><i>“</i><p>${esc(r.text)}</p><hr><b>${esc(r.author)}</b><small>${esc(r.role)}</small></div>`))}</div></div></div></section>

  <section class="sec" id="about"><p class="cm rv">${cm}</p></section>

  <footer class="ft"><div class="fg"><div><h3>${hl(st.footer.tagline)}</h3><form class="nl" id="nl"><input type="email" required placeholder="vous@exemple.com" aria-label="E-mail"><button class="btn" type="submit">S’abonner</button></form></div>
    <div class="cols">${st.footer.columns.map((c) => `<div><h4>${esc(c.title)}</h4>${c.links.map((l) => `<a href="${esc(l.href === '#wa' ? $('#wa').href : l.href)}">${esc(l.label)}</a>`).join('')}</div>`).join('')}</div></div>
    <div class="wm">${esc(st.name)}</div><div class="fb"><span>© ${new Date().getFullYear()} ${esc(st.name)}</span><a href="#">Retour en haut ↑</a></div></footer>`;

  renderTrack(S.products); drawArt(); bind();
}

/* Illustration du hero : branche feuillue + flacon (remplaçable par st.hero.image) */
function drawArt() {
  let r = 7, rnd = () => (r = (r * 16807) % 2147483647) / 2147483647, leaves = '';
  for (let i = 0; i < 90; i++) { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * 190, x = 330 + Math.cos(a) * d * 1.15, y = 250 + Math.sin(a) * d * .8; leaves += `<ellipse cx="${x | 0}" cy="${y | 0}" rx="${10 + rnd() * 14 | 0}" ry="${6 + rnd() * 8 | 0}" transform="rotate(${rnd() * 180 | 0} ${x | 0} ${y | 0})" fill="hsl(${88 + rnd() * 30 | 0} ${28 + rnd() * 14 | 0}% ${28 + rnd() * 22 | 0}%)" opacity=".92"/>`; }
  $('#art').innerHTML = `<defs><linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#cfc8c2"/><stop offset="1" stop-color="#eee9e4"/></linearGradient></defs>
    <rect x="150" width="450" height="700" fill="url(#w)" opacity=".92"/><rect x="560" width="14" height="700" fill="#9aa4ad" opacity=".6"/>
    <path d="M330 640C335 520 305 470 330 380S300 290 330 250" stroke="#2a1a14" stroke-width="9" fill="none" stroke-linecap="round"/>${leaves}
    <rect x="270" y="610" width="120" height="70" rx="8" fill="#1d1416"/><ellipse cx="330" cy="612" rx="62" ry="8" fill="#2c2124"/>`;
}

/* ---------- Panier ---------- */
function renderCart() {
  const n = cart.reduce((s, i) => s + i.qty, 0), tot = cart.reduce((s, i) => s + i.qty * (byId(i.id)?.price || 0), 0);
  const c = $('#cnt'); c.textContent = n; c.classList.toggle('on', n > 0);
  $('#sub').textContent = money(tot);
  $('#items').innerHTML = cart.length ? cart.map((i) => { const p = byId(i.id); return p ? `<div class="ci"><div class="t"><img src="${esc(img(p))}" alt=""></div><div><b>${esc(p.name)}</b><small>${esc(p.size)} · ${money(p.price)}</small></div><div class="qty"><button data-q="${esc(i.id)}" data-d="-1" aria-label="Moins">−</button>${i.qty}<button data-q="${esc(i.id)}" data-d="1" aria-label="Plus">+</button></div></div>` : ''; }).join('') : '<p>Votre panier est vide.</p>';
  $('#checkout').disabled = !cart.length; $('#checkout').style.opacity = cart.length ? 1 : .5;
}
function addToCart(id) { const p = byId(id); if (!p) return; const i = cart.find((x) => x.id === id); i ? i.qty++ : cart.push({ id, qty: 1 }); save(); renderCart(); toast(p.name + ' ajouté à votre panier'); API.track('add_to_cart', id); }
const openBag = (o) => { $('#dr').classList.toggle('on', o); $('#ov').classList.toggle('on', o); };

function checkout() {
  const items = cart.map((i) => ({ item: byId(i.id), qty: i.qty })).filter((x) => x.item);
  if (!items.length) return;
  const total = items.reduce((s, x) => s + x.item.price * x.qty, 0);
  const msg = [S.store.whatsappMessage, ...items.map((x) => `- ${x.qty} x ${x.item.name} (${x.item.size}) - ${money(x.item.price * x.qty)}`), `Total : ${money(total)}`, 'Pouvez-vous me confirmer la disponibilité ? Merci !'].join('\n');
  API.createOrder({ items: cart.map((i) => ({ productId: i.id, qty: i.qty })), message: msg }).catch(() => {});   // non bloquant
  API.track('whatsapp_click');
  window.open(`https://wa.me/${S.store.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

/* ---------- Événements ---------- */
function bind() {
  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && (e.target.classList.add('in'), io.unobserve(e.target))), { threshold: .12 });
  document.querySelectorAll('.rv').forEach((el) => io.observe(el));
  $('#app').addEventListener('click', (e) => {
    const a = e.target.closest('[data-add]'); if (a) return addToCart(a.dataset.add);
    const s = e.target.closest('[data-sc]'); if (s) { const t = $('#track'); t.scrollBy({ left: +s.dataset.sc * t.clientWidth * .8, behavior: 'smooth' }); return; }
    const f = e.target.closest('[data-fam]'); if (f) renderTrack(S.products.filter((p) => p.family === f.dataset.fam));
  });
  $('#nl').addEventListener('submit', (e) => { e.preventDefault(); API.subscribe(e.target.querySelector('input').value).then(() => { toast('Merci, à très bientôt !'); e.target.reset(); }).catch(() => toast('Une erreur est survenue, réessayez.')); });
  const sw = [...document.querySelectorAll('#story .w')], story = $('#story');
  const onScroll = () => {
    $('#nav').classList.toggle('solid', scrollY > 60);
    const r = story.getBoundingClientRect(), p = Math.min(1, Math.max(0, (innerHeight * .85 - r.top) / (r.height * .75)));
    sw.forEach((w, i) => w.style.opacity = i / sw.length < p ? 1 : .25);
  };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
}
$('#bagBtn').onclick = () => openBag(true); $('#closeBag').onclick = $('#ov').onclick = () => openBag(false);
$('#checkout').onclick = checkout;
$('#items').addEventListener('click', (e) => { const b = e.target.closest('[data-q]'); if (!b) return; const i = cart.find((x) => x.id === b.dataset.q); i.qty += +b.dataset.d; if (i.qty < 1) cart = cart.filter((x) => x !== i); save(); renderCart(); });
$('#q').addEventListener('input', (e) => { const v = e.target.value.trim().toLowerCase(); renderTrack(S.products.filter((p) => (p.name + ' ' + p.note + ' ' + p.family + ' ' + p.tagline).toLowerCase().includes(v))); if (v) $('#shop').scrollIntoView({ behavior: 'smooth' }); });
addEventListener('keydown', (e) => e.key === 'Escape' && openBag(false));

/* ---------- Démarrage ---------- */
(async () => {
  load();
  try { S = await API.home(); } catch (e) { $('#app').innerHTML = '<p class="empty" style="padding-top:140px;text-align:center">Boutique momentanément indisponible.</p>'; return; }
  render(); renderCart(); API.track('view');
})();
</script>
